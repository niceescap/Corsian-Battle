name: bataille_corse
description: "Bataille Corse — jeu de cartes, en duel contre la machine ou en ligne."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Multijoueur en ligne : REST (auth + tables) et WebSocket (jeu).
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  # Session persistée (jetons, identifiant d'appareil).
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cartes/
