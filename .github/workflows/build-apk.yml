name: Build APK

on:
  push:
    branches: [main, feat/**, docs/**, fix/**]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
    # Un tag `v*` déclenche la version signée et publie une release GitHub.
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.6'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # L'arbre `android/` est DÉSORMAIS versionné dans le dépôt : il porte
      # le nom d'application « Corsian Battle », la permission INTERNET et
      # la configuration de sécurité réseau. On ne le régénère plus : le
      # faire écraserait ces réglages (cf. docs/DEPLOIEMENT.md §9).
      - name: Dépendances
        working-directory: app
        run: flutter pub get

      # L'analyse statique est bloquante : elle doit rester verte.
      - name: Analyse statique
        working-directory: app
        run: flutter analyze

      # Test d'intégration réseau : ignoré s'il n'y a pas de serveur local.
      - name: Tests
        working-directory: app
        run: flutter test

      # --- Artefact de recette : APK debug, toujours produit --------------
      - name: Construit l'APK debug
        working-directory: app
        run: flutter build apk --debug

      - name: Prépare l'artefact debug
        run: |
          cp app/build/app/outputs/flutter-apk/app-debug.apk \
             corsian-battle-debug.apk
          sha256sum corsian-battle-debug.apk > corsian-battle-debug.apk.sha256
          ls -lh corsian-battle-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: |
            corsian-battle-debug.apk
            corsian-battle-debug.apk.sha256
          if-no-files-found: error

      # --- Version signée -------------------------------------------------
      # Le keystore ne transite QUE par les secrets du dépôt : il n'est
      # jamais commité. Sans les secrets, le build retombe sur les clés de
      # debug et l'artefact est marqué « non signé » — la CI ne ment pas.
      - name: Expose la clé de signature
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de signature absents : le build release est signé avec les clés de DEBUG et n'est PAS publiable."
          fi

      - name: Construit l'APK release
        if: steps.signature.outputs.disponible == 'true'
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Construit l'AAB release
        if: steps.signature.outputs.disponible == 'true'
        working-directory: app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Prépare les artefacts release
        if: steps.signature.outputs.disponible == 'true'
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             corsian-battle-release.apk
          cp app/build/app/outputs/bundle/release/app-release.aab \
             corsian-battle-release.aab
          sha256sum corsian-battle-release.apk corsian-battle-release.aab \
            > corsian-battle-release.sha256
          ls -lh corsian-battle-release.*

      - uses: actions/upload-artifact@v4
        if: steps.signature.outputs.disponible == 'true'
        with:
          name: release-signe
          path: |
            corsian-battle-release.apk
            corsian-battle-release.aab
            corsian-battle-release.sha256
          if-no-files-found: error

      # --- Release GitHub (uniquement sur un tag v*) ------------------------
      - name: Publie la release GitHub
        if: startsWith(github.ref, 'refs/tags/v') && steps.signature.outputs.disponible == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            corsian-battle-release.apk
            corsian-battle-release.aab
            corsian-battle-release.sha256
          generate_release_notes: true
